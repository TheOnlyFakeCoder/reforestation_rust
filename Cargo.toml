[package]
name = "reforestation"
version = "0.1.0"
edition = "2021"

[lib]
name = "reforestation"
path = "src/lib.rs"

[[bin]]
name = "simulation"
path = "src/bin/simulation.rs"

[[bin]]
name = "writer"
path = "src/bin/writer.rs"

[[bin]]
name = "ui"
path = "src/bin/ui.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36"
